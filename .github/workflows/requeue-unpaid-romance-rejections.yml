name: Re-queue unpaid romance-gate rejections

# One-shot: the unpaid gate used to accept only straight-romance leads; it now
# also accepts comedy leads. Roles it passed on are in rejected_roles, and
# is_rejected() skips them forever. Delete those rows so the next unpaid run
# re-judges any still-listed role under the romance-or-comedy gate. Roles that
# still don't qualify are simply rejected again.
#
# Trigger via the Actions tab → "Re-queue unpaid romance-gate rejections" → Run workflow.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: db-access
  cancel-in-progress: false

jobs:
  requeue:
    runs-on: ubuntu-latest
    steps:
      # Needed for the local ./.github/actions/upload-db action.
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download database
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          gh release download db-storage --pattern applied.db --dir data/ --clobber --repo "${{ github.repository }}"

      - name: Show what will be deleted
        run: |
          sqlite3 data/applied.db <<'SQL'
          .mode column
          .headers on
          SELECT id, platform, project_name, role_name,
                 substr(rejection_reason, 1, 80) AS reason_preview
            FROM rejected_roles
           WHERE mode = 'unpaid'
             AND rejection_reason LIKE '%romance%';
          SELECT COUNT(*) AS will_delete
            FROM rejected_roles
           WHERE mode = 'unpaid'
             AND rejection_reason LIKE '%romance%';
          SQL

      - name: Delete romance-gate rejections
        run: |
          sqlite3 data/applied.db <<'SQL'
          BEGIN;
          DELETE FROM rejected_roles
           WHERE mode = 'unpaid'
             AND rejection_reason LIKE '%romance%';
          COMMIT;
          SELECT changes() AS deleted_rows;
          SQL

      - name: Upload database
        uses: ./.github/actions/upload-db
        with:
          github-token: ${{ github.token }}
