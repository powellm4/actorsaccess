credentials:
  username: "your_username"
  password: "your_password"

filters:
  region: "Los Angeles"
  gender: "male"
  age_range: [25, 35]
  union_status: "any"
  paying_only: true
  exclude_reality_tv: true

submission:
  headshot_index: 0
  include_media: true
  # Clip that must end up attached, as Actors Access names it in the
  # submission modal (case-insensitive substring match). If "Select All" is
  # missing from the modal, this clip is ticked by name instead; if it is not
  # listed at all, the run logs a warning rather than submitting silently.
  required_media_name: "commercial acting reel"
  include_size_card: true
  default_note: ""

schedule:
  interval_hours: 4

browser:
  headless: true

logging:
  level: "INFO"
  file: "logs/auto_apply.log"

# Optional: Apply Anyway overrides. See README → "Apply Anyway via GitHub
# Issues". Requires OVERRIDE_GITHUB_TOKEN env var. Add the SAME block to every
# platform config (config*.yaml, cn_config*.yaml, backstage_config*.yaml) —
# each platform only processes its own queued overrides, so a config missing
# this block leaves that platform's "apply anyway" issues queued but never
# applied or closed.
# overrides:
#   repo: "your-username/aa-overrides"
#   label: "apply-anyway"
#   # Optional one-click apply: deploy worker/ (see worker/README.md) and set
#   # OVERRIDE_SIGNING_SECRET, then point apply_url at the worker. Without it,
#   # the button uses GitHub's pre-filled issue form (two clicks).
#   apply_url: "https://aa-apply.<your-subdomain>.workers.dev/apply"
